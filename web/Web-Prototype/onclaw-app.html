function withSessions(t) {
  const threads = {};
  Object.entries(t.threads).forEach(([cid, msgs]) => {
    if (!msgs || msgs.length === 0) {
      const extras0 = (EXTRA_SESSIONS[cid] || []).map((s) => ({ ...s, id: uid('s'), messages: s.messages.slice() }));
      threads[cid] = { active: extras0.length ? extras0[0].id : null, list: extras0 };
      return;
    }
    const firstYou = msgs.find((m) => m.author === 'you');
    const title = firstYou
      ? (firstYou.text.length > 42 ? firstYou.text.slice(0, 42) + '…' : firstYou.text)
      : ('Scheduled · ' + (msgs[0].cron || 'digest')).slice(0, 48);
    const main = { id: uid('s'), title, updated: (msgs[msgs.length - 1] || {}).ts || '', messages: msgs };
    const extras = (EXTRA_SESSIONS[cid] || []).map((s) => ({ ...s, id: uid('s'), messages: s.messages.slice() }));
    threads[cid] = { active: main.id, list: [main].concat(extras) };
  });
  return {
    ...t,
    agents: (t.agents || []).map((a) => ({
      ...a,
      provider: a.provider || providerOf(a.model),
      skills: a.skills || ['research', 'summarize'],
      mcp: a.mcp || []
    })),
    threads
  };
}

function getThreadState(t, cid) {
  const th = t && t.threads ? t.threads[cid] : null;
  if (!th) return { active: null, list: [] };
  if (Array.isArray(th)) {
    return th.length ? { active: 's0', list: [{ id: 's0', title: 'Chat', updated: '', messages: th }] } : { active: null, list: [] };
  }
  return th;
}

const memberHandle = (m) => (m.kind === 'agent' ? m.name : m.name.split(' ')[0]).toLowerCase();
const parseMentions = (text, members) => {
  const tokens = (text.match(/@([A-Za-z]+)/g) || []).map((t) => t.slice(1).toLowerCase());
  return (members || []).filter((m) => tokens.includes(memberHandle(m)));
};

function MentionText({ text, members }) {
  if (!text || text.indexOf('@') === -1) return <>{text}</>;
  const handles = {};
  (members || []).forEach((m) => { handles[memberHandle(m)] = m; });
  const parts = text.split(/(@[A-Za-z]+)/g);
  return (
    <>
      {parts.map((p, i) => (
        p.charAt(0) === '@' && handles[p.slice(1).toLowerCase()]
          ? <span key={i} className="rounded-[4px] bg-[color-mix(in_oklab,var(--accent),13%,transparent)] px-1 font-medium text-accent">{p}</span>
          : <span key={i}>{p}</span>
      ))}
    </>
  );
}

    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) onClose(); };
    window.addEventListener('mousedown', h);
    return () => window.removeEventListener('mousedown', h);
  }, [open, onClose]);
  if (!open) return null;
  return (
    <div ref={ref} data-od-id="ws-switcher-popover"
      className="od-pop fixed left-[76px] top-[14px] z-40 w-64 overflow-hidden rounded-md border border-line bg-surface shadow-[var(--elev-raised)]">
      <div className="border-b border-linesoft px-3.5 pt-3 pb-2 text-[11px] font-semibold uppercase tracking-wider text-muted">Workspaces</div>
      <ul className="py-1.5">
        {Object.values(db).map((t) => (
          <li key={t.id}>
            <button type="button" onClick={() => onPick(t.id)} data-od-id={'ws-option-' + t.id}
              className={cx('flex w-full items-center gap-2.5 px-3.5 py-2 text-left transition-colors',
                t.id === currentId ? 'bg-[color-mix(in_oklab,var(--accent)_13%,transparent)]' : 'hover:bg-[color-mix(in_oklab,var(--fg)_6%,transparent)]')}>
              <span className={cx('flex h-7 w-7 items-center justify-center rounded-md text-[11px] font-semibold',
                t.id === currentId ? 'bg-accent text-accenton' : 'bg-warm text-fg2')}>
                {t.name.split(' ').map((w) => w[0]).join('')}
              </span>
              <span className="min-w-0 flex-1">
                <span className="block truncate text-[13px] font-medium text-fg">{t.name}</span>
                <span className="block font-mono text-[10px] text-muted">{t.agents.length} agents · {t.cron.filter((c) => c.enabled).length} schedules</span>
              </span>
              {t.id === currentId && <Icon name="check" size={14} className="shrink-0 text-accent"/>}
              <span className={cx('rounded-[5px] px-1.5 py-0.5 text-[10px] font-semibold',
                t.plan === 'Pro' ? 'bg-[color-mix(in_oklab,var(--accent)_18%,transparent)] text-accent' : 'bg-[color-mix(in_oklab,var(--fg)_7%,transparent)] text-muted')}>
                {t.plan}
              </span>
            </button>

      </ul>
      <div className="border-t border-linesoft p-2">
        <button type="button" onClick={onCreate} data-od-id="ws-create"
          className="flex w-full items-center gap-2 rounded-md px-2 py-2 text-[13px] text-muted transition-colors hover:bg-[color-mix(in_oklab,var(--fg)_6%,transparent)] hover:text-fg">
          <Icon name="plus" size={14}/> Create workspace
        </button>
      </div>
    </div>
  );
}

const COMMANDS = [
  { cmd: '/tools', desc: 'List this agent’s tools' },
  { cmd: '/model', desc: 'Show the model this agent runs on' },
  { cmd: '/schedule', desc: 'Open the cron editor' },
  { cmd: '/reset', desc: 'Clear this thread' },
  { cmd: '/help', desc: 'Show commands' }
];

function ToolCall({ t }) {
  const [open, setOpen] = useState(false);
  const bad = !!t.error;
  return (
    <div className="mb-2 overflow-hidden rounded-md border border-line bg-[color-mix(in_oklab,var(--fg)_4%,transparent)]">
      <button type="button" onClick={() => setOpen(!open)} data-od-id={'tool-' + t.name}
        className="flex w-full items-center gap-2 px-2.5 py-1.5 text-left transition-colors hover:bg-[color-mix(in_oklab,var(--fg)_4%,transparent)]">
        <Icon name="terminal" size={13} className={bad ? 'text-danger' : 'text-meta'}/>
        <span className={cx('font-mono text-[12px]', bad ? 'text-danger' : 'text-fg2')}>{t.name}</span>
        <span className="min-w-0 flex-1 truncate font-mono text-[11px] text-muted">{t.args}</span>
        {bad
          ? <span className="font-mono text-[10px] text-danger">error · {t.ms}ms</span>
          : <span className="font-mono text-[10px] text-muted">{t.ms}ms</span>}
        <Icon name="chevright" size={13} className={cx('text-muted transition-transform', open && 'rotate-90')}/>
      </button>
      {open && (
        <div className="border-t border-linesoft px-2.5 py-2 font-mono text-[11px] leading-5">
          <p className="text-muted">args</p>
          <p className="mb-1.5 text-fg2">{t.args}</p>
          <p className="text-muted">{bad ? 'error' : 'result'}</p>
          <p className={bad ? 'text-danger' : 'text-fg2'}>{bad ? t.error : 'ok — ' + (t.ms + 40) + 'ms, ' + Math.max(1, Math.round(t.ms / 90)) + ' rows'}</p>
        </div>
      )}
    </div>
  );
}

function CronChip({ id }) {
  return (
    <span className="inline-flex items-center gap-1 rounded-[5px] bg-[color-mix(in_oklab,var(--fg)_6%,transparent)] px-1.5 py-0.5 font-mono text-[10px] text-muted" title={'Generated by the “' + id + '” schedule'}>
      <Icon name="clock" size={10}/> cron · {id}
    </span>

}

const variantsOf = (m) => m.branches || [{ text: m.text, tools: m.tools }];

function BranchPicker({ index, count, onPrev, onNext }) {
  const btn = 'flex h-6 w-6 items-center justify-center rounded-full text-muted transition-colors hover:bg-[color-mix(in_oklab,var(--fg)_8%,transparent)] hover:text-fg disabled:pointer-events-none disabled:opacity-30';
  return (
    <div className="inline-flex items-center gap-0.5 text-[11px] text-muted" data-od-id="branch-picker">
      <button type="button" className={btn} onClick={onPrev} disabled={index <= 0} aria-label="Previous response" title="Previous response">
        <Icon name="chevleft" size={13}/>
      </button>
      <span className="min-w-9 text-center font-medium tabular-nums">{index + 1} / {count}</span>
      <button type="button" className={btn} onClick={onNext} disabled={index >= count - 1} aria-label="Next response" title="Next response">
        <Icon name="chevright" size={13}/>
      </button>
    </div>
  );
}

function AgentMessage({ m, agent, inChannel, streaming, busy, isLast, onDone, onCopy, onGrow, onRefresh, onBranch, members }) {
  const variants = variantsOf(m);
  const v = variants[m.branch || 0] || variants[0];
  const [n, setN] = useState(streaming ? 0 : v.text.length);
  const doneRef = useRef(false);
  const [copied, setCopied] = useState(false);

  useEffect(() => {
    if (!streaming) { setN(v.text.length); doneRef.current = false; return; }
    setN(0); doneRef.current = false;
    const iv = setInterval(() => {
      if (onGrow) onGrow();
      setN((x) => {
        if (x + 3 >= v.text.length) {
          clearInterval(iv);
          if (!doneRef.current) { doneRef.current = true; setTimeout(onDone, 0); }
          return v.text.length;
        }
        return x + 3;
      });
    }, 22);
    return () => clearInterval(iv);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [streaming, m.id]);

  useEffect(() => {
    if (!streaming) setN(variantsOf(m)[m.branch || 0].text.length);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [m.branch]);

  const shown = v.text.slice(0, n);
  const doCopy = () => { setCopied(true); onCopy(v.text); setTimeout(() => setCopied(false), 1400); };
  const actBtn = 'flex h-7 w-7 items-center justify-center rounded-full text-muted transition-colors hover:bg-[color-mix(in_oklab,var(--fg)_8%,transparent)] hover:text-fg';

  return (
    <div className="group flex gap-3 px-2" data-od-id={'msg-' + m.id} data-role="assistant">
      <Avatar name={agent ? agent.name : 'Agent'} kind="agent" size={26}/>
      <div className="min-w-0 flex-1">
        {inChannel && (
          <div className="mb-0.5 flex items-center gap-2">
            <span className="text-[13px] font-semibold text-fg">{agent ? agent.name : 'Agent'}</span>
            {m.cron && <CronChip id={m.cron}/>}
          </div>
        )}
        {!inChannel && m.cron && <div className="mb-1"><CronChip id={m.cron}/></div>}
        {v.tools && v.tools.map((t, i) => <ToolCall key={i} t={t}/>)}
        <div className="whitespace-pre-wrap text-[15px] leading-relaxed text-fg">
          {streaming || n > 0 ? (
            <>
              <MentionText text={shown} members={members}/>
              {streaming && n < v.text.length && <span className="od-caret"/>}
            </>
          ) : (
            <span className="inline-flex items-center gap-1 py-1"><span className="od-dot"/><span className="od-dot"/><span className="od-dot"/></span>
          )}
        </div>
        {!busy && (
          <div className="-ms-1.5 mt-1 flex items-center gap-2">
            {variants.length > 1 && (
              <BranchPicker index={m.branch || 0} count={variants.length}
                onPrev={() => onBranch(m.id, -1)} onNext={() => onBranch(m.id, 1)}/>
            )}
            <div className={cx('flex items-center gap-0.5', !isLast && 'opacity-0 transition-opacity focus-within:opacity-100 group-hover:opacity-100')}>
              <button type="button" onClick={doCopy} data-od-id={'msg-copy-' + m.id} aria-label="Copy message" title="Copy"
                className={actBtn}>
                <Icon name={copied ? 'check' : 'copy'} size={13}/>
              </button>
              <button type="button" onClick={() => onRefresh(m.id)} data-od-id={'msg-refresh-' + m.id} aria-label="Refresh — generate a new response" title="Refresh"
                className={actBtn}>
                <Icon name="refresh" size={13}/>
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function UserMessage({ m, onEdit, members }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(m.text);
  const startEdit = () => { setVal(m.text); setEditing(true); };
  const submitEdit = () => {
    const t = val.trim();
    setEditing(false);
    if (t && t !== m.text) onEdit(m.id, t);
  };
  if (editing) {
    return (
      <div className="flex flex-col px-2" data-od-id={'msg-' + m.id}>
        <div className="ms-auto flex w-full max-w-[85%] flex-col rounded-[24px] border border-line bg-surface p-2 transition-colors focus-within:border-accent">
          <textarea autoFocus rows={Math.min(6, val.split('\n').length + 1)} value={val} aria-label="Edit message"
            onChange={(e) => setVal(e.target.value)}
            onKeyDown={(e) => {
              if (e.key === 'Escape') { e.preventDefault(); setEditing(false); }
              if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitEdit(); }
            }}
            className="w-full resize-none bg-transparent px-2.5 py-1.5 text-[15px] leading-6 text-fg outline-none"/>
          <div className="mx-1 mb-1 flex items-center justify-end gap-1.5">

              Cancel

            <button type="button" onClick={submitEdit} data-od-id="btn-update-message"
              className="h-8 rounded-full bg-accent px-3.5 text-[13px] font-semibold text-accenton transition-colors hover:bg-[var(--accent-hover)] active:bg-[var(--accent-active)]">
              Update
            </button>
          </div>
        </div>
      </div>
    );
  }
  return (
    <div className="group flex justify-end px-2" data-od-id={'msg-' + m.id} data-role="user">
      <div className="relative max-w-[85%]">
        <button type="button" onClick={startEdit} aria-label="Edit message" title="Edit"
          className="absolute right-full top-1/2 mr-2 flex h-7 w-7 -translate-y-1/2 items-center justify-center rounded-full text-muted opacity-0 transition-opacity hover:bg-[color-mix(in_oklab,var(--fg)_8%,transparent)] hover:text-fg focus-visible:opacity-100 group-hover:opacity-100">

function Composer({ agent, running, onSend, onCancel, onAttach, mentionOptions }) {
  const [text, setText] = useState('');
  const [idx, setIdx] = useState(0);
  const ta = useRef(null);
  const slashQ = text.startsWith('/') ? text.split(' ')[0] : '';
  const slashOpen = !!slashQ && COMMANDS.some((c) => c.cmd.startsWith(slashQ.toLowerCase()));
  const slashList = slashOpen ? COMMANDS.filter((c) => c.cmd.startsWith(slashQ.toLowerCase())) : [];
  const mentionMatch = mentionOptions ? (text.match(/@([A-Za-z]*)$/) || null) : null;
  const mentionList = mentionMatch
    ? mentionOptions.filter((m) => memberHandle(m).startsWith(mentionMatch[1].toLowerCase()))
    : [];
  const menu = slashOpen ? 'slash' : (mentionMatch && mentionList.length ? 'mention' : null);
  useEffect(() => { setIdx(0); }, [menu]);

  const grow = () => { const el = ta.current; if (el) { el.style.height = 'auto'; el.style.height = Math.min(192, el.scrollHeight) + 'px'; } };
  const submit = (raw) => {
    if (running) return;
    const val = (raw !== undefined ? raw : text).trim();
    if (!val) return;
    onSend(val);
    setText('');
    requestAnimationFrame(grow);
  };

  const pickMention = (m) => {
    const handle = m.kind === 'agent' ? m.name : m.name.split(' ')[0];
    setText(text.replace(/@[A-Za-z]*$/, '@' + handle + ' '));
    requestAnimationFrame(() => ta.current && ta.current.focus());
  };

  const onKeyDown = (e) => {
    if (menu && e.key === 'ArrowDown') { e.preventDefault(); const n = menu === 'slash' ? slashList.length : mentionList.length; setIdx((i) => Math.min(n - 1, i + 1)); return; }
    if (menu && e.key === 'ArrowUp') { e.preventDefault(); setIdx((i) => Math.max(0, i - 1)); return; }
    if (e.key === 'Escape' && menu) { e.preventDefault(); setText(''); return; }
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (menu === 'slash' && slashList[idx]) { setText(slashList[idx].cmd + ' '); setIdx(0); return; }
      if (menu === 'mention' && mentionList[idx]) { pickMention(mentionList[idx]); setIdx(0); return; }
      submit();
    }
  };

  return (
    <div className="relative" data-od-id="composer">
      {menu === 'slash' && <SlashMenu q={slashQ} idx={idx} onPick={(cmd) => { setText(cmd + ' '); setIdx(0); ta.current && ta.current.focus(); }}/>}
      {menu === 'mention' && <MentionMenu options={mentionList} idx={idx} onPick={pickMention}/>}
      <div role="presentation" onClick={() => ta.current && ta.current.focus()}
        className="cursor-text rounded-[24px] border border-line bg-surface p-2 transition-colors focus-within:border-accent">
        <textarea ref={ta} rows={1} value={text} autoFocus aria-label={'Message input'}
          onChange={(e) => { setText(e.target.value); grow(); }} onKeyDown={onKeyDown}
          placeholder={mentionOptions ? 'Message the channel — @ to mention' : agent ? 'Message ' + agent.name + '…' : 'Send a message…'}
          enterKeyHint="send"
          className="max-h-48 min-h-10 w-full resize-none bg-transparent px-2.5 py-1.5 text-[15px] leading-6 text-fg outline-none placeholder:text-muted"/>
        <div className="flex items-center justify-between pt-0.5">
          <button type="button" onClick={(e) => { e.stopPropagation(); onAttach(); }} aria-label="Attach a file" title="Attach a file"
            className="flex h-7 w-7 items-center justify-center rounded-full text-muted transition-colors hover:bg-[color-mix(in_oklab,var(--fg)_8%,transparent)] hover:text-fg">
            <Icon name="clip" size={14}/>
          </button>
          {!running ? (
            <button type="button" onClick={(e) => { e.stopPropagation(); submit(); }} disabled={!text.trim()} data-od-id="btn-send"
              aria-label="Send message" title="Send message"
              className="flex h-8 w-8 items-center justify-center rounded-full bg-accent text-accenton transition-colors hover:bg-[var(--accent-hover)] active:bg-[var(--accent-active)] disabled:opacity-35 disabled:hover:bg-accent">
              <Icon name="up" size={15} sw={2.4}/>
            </button>
          ) : (
            <button type="button" onClick={(e) => { e.stopPropagation(); onCancel(); }} data-od-id="btn-cancel"
              aria-label="Stop generating" title="Stop generating"
              className="flex h-8 w-8 items-center justify-center rounded-full bg-accent text-accenton transition-colors hover:bg-[var(--accent-hover)] active:bg-[var(--accent-active)]">
              <Icon name="stop" size={12}/>
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function ChatView({ tenant, target, agent, thread, session, channelMembers, onToggleMembers,
  typing, streamingId, busy, onConfigure,
  onSend, onCancel, onDoneStream, onAttach, onCopy, onRefresh, onBranch, onEditSubmit }) {
  const listRef = useRef(null);
  const atBottomRef = useRef(true);
  const [atBottom, setAtBottom] = useState(true);
  const prevLen = useRef(thread.length);
  const prevChat = useRef(target.obj.id);
  const prevSession = useRef(session && session.id);

  // long-history guard: render the latest window, load older on demand
  const [msgLimit, setMsgLimit] = useState(80);
  useEffect(() => { setMsgLimit(80); }, [session && session.id]);
  const visibleMsgs = thread.length > msgLimit ? thread.slice(thread.length - msgLimit) : thread;
  const hiddenMsgs = thread.length - visibleMsgs.length;

  const pinBottom = () => {
    const el = listRef.current;
    if (el && atBottomRef.current) el.scrollTop = el.scrollHeight;
  };

  useEffect(() => {
    const el = listRef.current;
    if (!el) return;
    const sameChat = target.obj.id === prevChat.current;
    const sameSession = (session && session.id) === prevSession.current;
    const lastMsg = thread[thread.length - 1];
    const grewUser = sameChat && sameSession && thread.length > prevLen.current && lastMsg && lastMsg.author === 'you';
    prevLen.current = thread.length;
    prevChat.current = target.obj.id;
    prevSession.current = session && session.id;
    if (grewUser) {
      // assistant-ui turnAnchor="top" — a fresh user message pins to the top of the viewport
      const nodes = el.querySelectorAll('[data-role="user"]');
      const node = nodes[nodes.length - 1];
      if (node) el.scrollTop = Math.max(0, node.offsetTop - 16);
      else el.scrollTop = el.scrollHeight;
    } else {
      el.scrollTop = el.scrollHeight;
    }
  }, [thread.length, typing, streamingId, target.obj.id, session && session.id]);

  const onScroll = (e) => {
    const el = e.currentTarget;
    const b = el.scrollHeight - el.scrollTop - el.clientHeight < 36;
    atBottomRef.current = b;
    setAtBottom(b);
  };
  const scrollToBottom = () => {
    const el = listRef.current;
    if (el) el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
  };

  const isEmpty = thread.length === 0 && !typing;
  const suggestions = agent ? [
    'Summarize the latest activity for me',
    'What are you working on right now?',
    'Draft a status update for the team',
    'What should I know about ' + tenant.name + ' today?'
  ] : [];

  return (
    <section data-od-id="chat-view" className="flex min-w-0 flex-1 flex-col bg-bg" aria-label={'Conversation with ' + (target.kind === 'channel' ? '#' + target.obj.name : target.obj.name)}>
      <ChatHeader target={target} agent={agent} channelMembers={channelMembers} onToggleMembers={onToggleMembers} onConfigure={onConfigure}/>
      <div ref={listRef} onScroll={onScroll} className="od-scroll relative flex-1 overflow-y-auto" data-od-id="message-list">
        {isEmpty ? (
          <div className="flex h-full flex-col items-center justify-center gap-2 px-4 text-center">
            {agent && <Avatar name={agent.name} kind="agent" size={44}/>}
            <h2 className="text-[22px] font-medium tracking-tight text-fg" data-od-id="welcome-title">
              {agent ? 'This is ' + agent.name : target.kind === 'channel' ? '#' + target.obj.name : target.obj.name}
            </h2>
            <p className="max-w-md text-[13px] leading-5 text-muted">
              {agent ? agent.role + '.'
                : target.kind === 'channel' ? target.obj.purpose + '.'
                : 'No messages yet — say hello.'}
            </p>
          </div>
        ) : (
          <div className="mx-auto flex w-full max-w-[44rem] flex-col gap-6 px-4 pb-6 pt-5">
            {hiddenMsgs > 0 && (
              <div className="flex justify-center px-2" data-od-id="load-earlier">
                <button type="button" onClick={() => setMsgLimit((l) => l + 400)}
                  className="rounded-full border border-line bg-surface px-3 py-1 text-[11px] text-muted transition-colors hover:text-fg">
                  Load earlier messages · {hiddenMsgs} hidden
                </button>
              </div>
            )}
            {hiddenMsgs === 0 && thread.length > 80 && session && (
              <p className="text-center text-[11px] text-muted">Beginning of “{session.title}”</p>
            )}
            {visibleMsgs.map((m) => {
              const isLast = m.id === (thread[thread.length - 1] || {}).id;
              const msgAgent = (m.agentId && tenant.agents.find((a) => a.id === m.agentId)) || agent;
              if (m.author === 'you') return <UserMessage key={m.id} m={m} onEdit={onEditSubmit} members={channelMembers}/>;
              if (m.author === 'other') return <OtherMessage key={m.id} m={m} members={channelMembers}/>;
              return (
                <AgentMessage key={m.id} m={m} agent={msgAgent} inChannel={target.kind === 'channel'}
                  streaming={streamingId === m.id} busy={busy} isLast={isLast}
                  onDone={onDoneStream} onCopy={onCopy} onGrow={pinBottom}
                  onRefresh={onRefresh} onBranch={onBranch} members={channelMembers}/>
              );
            })}
            {typing && <ThinkingRow agent={agent}/>}
          </div>
        )}
      </div>
      <div className="relative shrink-0">
        <button type="button" onClick={scrollToBottom} data-od-id="btn-scroll-bottom"
          aria-label="Scroll to bottom" title="Scroll to bottom"
          className={cx('absolute -top-11 left-1/2 z-10 flex h-9 w-9 -translate-x-1/2 items-center justify-center rounded-full border border-line bg-surface text-fg2 shadow-[var(--elev-raised)] transition-colors hover:bg-[color-mix(in_oklab,var(--fg)_5%,transparent)] hover:text-fg', (atBottom || isEmpty) && 'invisible')}>
          <Icon name="down" size={15}/>
        </button>
        <div className="mx-auto w-full max-w-[44rem] px-4 pb-4">
          <Composer agent={agent} running={busy} onSend={onSend} onCancel={onCancel} onAttach={onAttach}
            mentionOptions={target.kind === 'channel' ? channelMembers : null}/>
          {isEmpty && agent && suggestions.length > 0 && (
            <div className="mt-3 flex flex-wrap items-center justify-center gap-2 px-1" data-od-id="welcome-suggestions">
              {suggestions.map((s) => (
                <button key={s} type="button" onClick={() => onSend(s)}
                  className="rounded-full border border-line bg-surface px-3.5 py-1.5 text-[13px] font-normal text-fg2 transition-colors hover:bg-[color-mix(in_oklab,var(--fg)_5%,transparent)] hover:text-fg">
                  {s}
                </button>
              ))}
            </div>
          )}
        </div>
      </div>
    </section>
  );
}

/* ============================== agents view ============================== */
function ViewShell({ title, sub, action, children, odId }) {

function Segmented({ value, options, onChange }) {
  return (
    <div className="flex rounded-md border border-line bg-[color-mix(in_oklab,var(--fg)_6%,transparent)] p-0.5" role="radiogroup">
      {options.map((o) => (
        <button key={o.id} type="button" role="radio" aria-checked={value === o.id} onClick={() => onChange(o.id)}
          className={cx('flex-1 rounded-[9px] px-2 py-1.5 text-[12px] font-medium transition-colors',
            value === o.id ? 'bg-surface text-fg shadow-[var(--elev-raised)]' : 'text-muted hover:text-fg')}>
          {o.label}
        </button>
      ))}
    </div>
  );
}

function OptionChips({ options, value, onChange, iconOf }) {
  return (
    <div className="flex flex-wrap gap-2">
      {options.map((o) => {
        const on = value.includes(o.id);
        return (
          <button key={o.id} type="button" aria-pressed={on} title={o.detail || o.label}
            onClick={() => onChange(on ? value.filter((x) => x !== o.id) : [...value, o.id])}
            className={cx('flex h-8 items-center gap-1.5 rounded-md border px-3 text-[12px] font-medium transition-colors',
              on ? 'border-accent bg-[color-mix(in_oklab,var(--accent),14%,transparent)] text-fg' : 'border-line text-muted hover:border-[color-mix(in_oklab,var(--fg),26%,transparent)] hover:text-fg2')}>
            {iconOf && <Icon name={iconOf(o)} size={13}/>}
            {o.label}
          </button>
        );
      })}
    </div>
  );
}

function MicroLabel({ children }) {
  return <p className="font-mono text-[10px] font-semibold uppercase tracking-[0.14em] text-muted">{children}</p>;
}

function AgentConfigModal({ draft, onClose, onSave, skillOptions }) {
  const isEdit = !!draft;
  const [name, setName] = useState(draft ? draft.name : '');
  const [provider, setProvider] = useState(draft ? providerOf(draft.model) : PROVIDERS[0].id);
  const [model, setModel] = useState(draft ? draft.model : PROVIDERS[0].models[0]);
  const [temp, setTemp] = useState(draft ? draft.temp : 0.4);
  const [role, setRole] = useState(draft ? draft.role : '');
  const [tools, setTools] = useState(draft ? [...draft.tools] : ['web']);
  const [skills, setSkills] = useState(draft ? [...(draft.skills || ['research'])] : ['research']);
  const [mcp, setMcp] = useState(draft ? [...(draft.mcp || [])] : []);
  const [autonomy, setAutonomy] = useState(draft ? draft.autonomy : 'approval');
  const [prompt, setPrompt] = useState(draft ? draft.prompt : '');
  const [channelPost, setChannelPost] = useState(draft ? draft.channelPost : false);
  const providerObj = PROVIDERS.find((p) => p.id === provider) || PROVIDERS[0];
  const valid = name.trim().length > 1;
  return (
    <Modal title={isEdit ? 'Configure ' + draft.name : 'Deploy a new agent'} onClose={onClose} wide odId="agent-config-modal"
      footer={<>
        <button type="button" onClick={onClose} className="flex h-9 items-center rounded-md px-3.5 text-[13px] font-medium text-muted transition-colors hover:bg-[color-mix(in_oklab,var(--fg),7%,transparent)] hover:text-fg2">Cancel</button>
        <button type="button" disabled={!valid} data-od-id="btn-agent-save-modal"
          onClick={() => onSave({ name: name.trim(), role: role.trim() || 'General-purpose agent', provider, model, temp, autonomy, tools, skills, mcp, prompt: prompt.trim(), channelPost })}
          className="flex h-9 items-center rounded-md bg-accent px-3.5 text-[13px] font-semibold text-accenton transition-colors hover:bg-[var(--accent-hover)] active:bg-[var(--accent-active)] disabled:opacity-40 disabled:hover:bg-accent">
          {isEdit ? 'Save changes' : 'Deploy agent'}
        </button>
      </>}>
      <div className="grid gap-6 p-5 md:grid-cols-2">
        <div className="space-y-5">
          <MicroLabel>Identity &amp; behavior</MicroLabel>
          <div className="grid grid-cols-2 gap-4">
            <div>
              <label className={labelCls} htmlFor="ac-name">Agent name</label>
              <input id="ac-name" className={inputCls} value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Radar" autoFocus/>
            </div>
            <div>
              <label className={labelCls} htmlFor="ac-provider">Provider</label>
              <select id="ac-provider" className={inputCls} value={provider}
                onChange={(e) => {
                  const pid = e.target.value;
                  setProvider(pid);
                  const p = PROVIDERS.find((x) => x.id === pid);
                  if (!p.models.includes(model)) setModel(p.models[0]);
                }}>
                {PROVIDERS.map((p) => <option key={p.id} value={p.id}>{p.label}</option>)}
              </select>
            </div>
          </div>
          <div className="grid grid-cols-2 gap-4">
            <div>
              <label className={labelCls} htmlFor="ac-model">Model</label>
              <select id="ac-model" className={inputCls} value={model} onChange={(e) => setModel(e.target.value)}>
                {providerObj.models.map((m) => <option key={m} value={m}>{m}</option>)}
              </select>
            </div>
            <div>
              <div className="mb-1.5 flex items-baseline justify-between">
                <label className={cx(labelCls, 'mb-0')} htmlFor="ac-temp">Temperature</label>
                <span className="font-mono text-[12px] text-fg2">{Number(temp).toFixed(1)}</span>
              </div>
              <input id="ac-temp" type="range" min="0" max="1" step="0.1" value={temp} onChange={(e) => setTemp(Number(e.target.value))} className="h-1.5 w-full cursor-pointer"/>
              <div className="mt-1 flex justify-between font-mono text-[10px] text-muted"><span>precise</span><span>balanced</span><span>loose</span></div>
            </div>
          </div>
          <div>
            <label className={labelCls} htmlFor="ac-role">Role in one line</label>
            <input id="ac-role" className={inputCls} value={role} onChange={(e) => setRole(e.target.value)} placeholder="e.g. watches competitor pricing and flags moves over 5%"/>
          </div>
          <div>
            <label className={labelCls} htmlFor="ac-prompt">System prompt</label>
            <textarea id="ac-prompt" rows={7} className={cx(inputCls, 'h-auto py-2.5 leading-6')} value={prompt} onChange={(e) => setPrompt(e.target.value)}
              placeholder="Leave empty to start from the base template — refine it anytime."/>
          </div>
        </div>
        <div className="space-y-5">
          <MicroLabel>Capabilities</MicroLabel>
          <div>
            <span className={labelCls}>Tools</span>
            <OptionChips options={TOOLS} value={tools} onChange={setTools} iconOf={(o) => TOOL_ICON[o.id]}/>
          </div>
          <div>
            <span className={labelCls}>Skills</span>
            <OptionChips options={skillOptions || SKILLS} value={skills} onChange={setSkills}/>
            <p className="mt-1.5 text-[11px] leading-4 text-muted">Installed and versioned in Settings → Skills.</p>
          </div>
          <div>
            <span className={labelCls}>MCP servers</span>
            <OptionChips options={MCP_SERVERS} value={mcp} onChange={setMcp}/>
            <p className="mt-1.5 text-[11px] leading-4 text-muted">Connectors are managed in Settings → MCP servers and exposed to the agent over the Model Context Protocol.</p>
          </div>
          <div>
            <span className={labelCls}>Autonomy</span>
            <Segmented value={autonomy} onChange={setAutonomy}
              options={[{ id: 'suggest', label: 'Suggest only' }, { id: 'approval', label: 'Act with approval' }, { id: 'full', label: 'Fully autonomous' }]}/>
          </div>
          <div className="flex items-center justify-between rounded-md border border-line bg-[color-mix(in_oklab,var(--bg),35%,var(--surface))] px-4 py-3">
            <div>
              <p className="text-[13px] font-medium text-fg">Post to channels on my behalf</p>
              <p className="text-[12px] text-muted">Lets this agent publish into its bound channels.</p>
            </div>
            <Toggle on={channelPost} onChange={setChannelPost} label="Post to channels on my behalf"/>
          </div>
        </div>
      </div>
    </Modal>
  );
}

/* ============================== cron + runs ============================== */
function LastRunCell({ last }) {
  if (!last) return <span className="text-[12px] text-muted">never</span>;
  const icon = last.status === 'success' ? <Icon name="check" size={13} className="text-[color-mix(in_oklab,var(--success),black_25%)]"/>
    : last.status === 'failed' ? <Icon name="x" size={13} className="text-danger"/>
    : <Icon name="clock" size={13} className="text-muted"/>;
  return <span className="flex items-center gap-1.5 text-[12px] text-fg2">{icon}<span className="font-mono text-[11px] text-muted">{last.when} · {last.dur}</span></span>;
}

function CronView({ tenant, onEdit, onToggle, onRunNow, onNew }) {
  return (
    <ViewShell odId="cron-view" title="Cron schedules"
      sub={'Recurring agent runs for ' + tenant.name + '. Expressions use standard 5-field cron in ' + tenant.tz + '.'}
      action={
        <button type="button" onClick={onNew} data-od-id="btn-new-schedule"
          className="flex h-9 items-center gap-2 rounded-md bg-accent px-3.5 text-[13px] font-semibold text-accenton transition-colors hover:bg-[var(--accent-hover)] active:bg-[var(--accent-active)]">
          <Icon name="plus" size={15} sw={2.2}/> New schedule
        </button>
      }>
      <div className="overflow-hidden rounded-lg border border-line" data-od-id="cron-table">
        <div className="grid grid-cols-[1.4fr_1.1fr_0.7fr_1fr_84px] gap-3 border-b border-linesoft bg-[color-mix(in_oklab,var(--fg)_4%,transparent)] px-4 py-2.5 font-mono text-[10px] uppercase tracking-[0.14em] text-muted">
          <span>Schedule</span><span>Expression</span><span>Next run</span><span>Last run</span><span className="text-right">State</span>
        </div>
        {tenant.cron.map((j) => {
          const agent = tenant.agents.find((a) => a.id === j.agentId);
          return (
            <div key={j.id} data-od-id={'cron-row-' + j.id}

              <div className="min-w-0">

                  className="flex h-7 w-7 items-center justify-center rounded-[6px] text-muted opacity-0 transition-opacity hover:bg-[color-mix(in_oklab,var(--fg)_9%,transparent)] hover:text-fg focus-visible:opacity-100 group-hover:opacity-100">
                  <Icon name="play" size={13}/>

function CronEditorModal({ job, tenant, onClose, onSave, onDelete }) {
  const isNew = !job.id;

  const valid = name.trim().length > 1 && /^[0-9*/,-\s]+$/.test(expr.trim());
  return (
    <Modal title={isNew ? 'New schedule' : 'Edit schedule'} onClose={onClose} odId="cron-editor-modal"
      footer={<>
        {!isNew && (
          <button type="button" onClick={() => onDelete(job)} data-od-id="btn-cron-delete"
            className="mr-auto flex h-9 items-center gap-1.5 rounded-md px-3 text-[13px] font-medium text-danger transition-colors hover:bg-[color-mix(in_oklab,var(--danger)_12%,transparent)]">
            <Icon name="x" size={14}/> Delete
          </button>
        )}
        <button type="button" onClick={onClose} className="flex h-9 items-center rounded-md px-3.5 text-[13px] font-medium text-muted transition-colors hover:bg-[color-mix(in_oklab,var(--fg)_7%,transparent)] hover:text-fg2">Cancel</button>
        <button type="button" disabled={!valid} data-od-id="btn-cron-save" onClick={() => onSave({ ...job, name: name.trim(), agentId, expr: expr.trim(), human: human.trim() || expr.trim(), enabled })}
          className="flex h-9 items-center rounded-md bg-accent px-3.5 text-[13px] font-semibold text-accenton transition-colors hover:bg-[var(--accent-hover)] active:bg-[var(--accent-active)] disabled:opacity-40 disabled:hover:bg-accent">
          {isNew ? 'Create schedule' : 'Save changes'}
        </button>
      </>}>
      <div className="space-y-5 p-5">
        <div>
          <label className={labelCls} htmlFor="cr-name">Schedule name</label>
          <input id="cr-name" className={inputCls} value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Nightly ETL check" autoFocus/>
        </div>
        <div className="grid grid-cols-2 gap-4">
          <div>
            <label className={labelCls} htmlFor="cr-agent">Agent</label>
            <select id="cr-agent" className={inputCls} value={agentId} onChange={(e) => setAgentId(e.target.value)}>
              {tenant.agents.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
            </select>
          </div>
          <div>
            <label className={labelCls} htmlFor="cr-tz">Timezone</label>
            <input id="cr-tz" className={cx(inputCls, 'font-mono text-[13px]')} value={tenant.tz} disabled title="Workspace timezone — change it in Settings → Workspace"/>
          </div>
        </div>
        <div className="grid grid-cols-2 gap-4">
          <div>
            <label className={labelCls} htmlFor="cr-expr">Cron expression</label>
            <input id="cr-expr" className={cx(inputCls, 'font-mono text-[13px]')} value={expr} onChange={(e) => setExpr(e.target.value)} placeholder="0 9 * * 1-5"/>
            {!valid && expr.trim() && <p className="mt-1.5 text-[11px] text-danger">Digits, spaces, * / , - only.</p>}
          </div>
          <div>
            <label className={labelCls} htmlFor="cr-human">Human label</label>
            <input id="cr-human" className={inputCls} value={human} onChange={(e) => setHuman(e.target.value)} placeholder="Weekdays · 9:00 AM"/>
          </div>
        </div>
        <div className="flex items-center justify-between rounded-md border border-line bg-[color-mix(in_oklab,var(--bg)_35%,var(--surface))] px-4 py-3">
          <div>
            <p className="text-[13px] font-medium text-fg">Enabled</p>
            <p className="text-[12px] text-muted">Disabled schedules keep their history and fire nothing.</p>
          </div>
          <Toggle on={enabled} onChange={setEnabled} label="Enable this schedule"/>
        </div>
      </div>
    </Modal>
  );
}

      <div className="overflow-hidden rounded-lg border border-line" data-od-id="runs-table">

          <span>Run</span><span>Agent</span><span>Trigger</span><span>Started</span><span>Duration</span><span>Tokens</span><span>Status</span>
        </div>
        {runs.map((r) => {
          const agent = tenant.agents.find((a) => a.id === r.agentId);
          return (
            <div key={r.id} data-od-id={'run-row-' + r.id}
              className="grid grid-cols-[110px_1fr_90px_110px_90px_80px_90px] items-center gap-3 border-b border-linesoft px-4 py-2.5 transition-colors last:border-b-0 hover:bg-[color-mix(in_oklab,var(--fg)_3%,transparent)]">
              <span className="font-mono text-[12px] text-fg2">{r.id}</span>
              <span className="truncate text-[13px] text-fg">{agent ? agent.name : '—'}</span>
              <Chip mono className="justify-self-start">{r.trigger}</Chip>
              <span className="font-mono text-[12px] text-fg2">{r.when}</span>
              <span className="font-mono text-[12px] text-fg2">{r.dur}</span>
              <span className="font-mono text-[12px] text-fg2">{r.tokens}</span>
              <span className={cx('flex items-center gap-1.5 font-mono text-[11px]', r.status === 'success' ? 'text-[color-mix(in_oklab,var(--success),black_25%)]' : 'text-danger')}>
                <Icon name={r.status === 'success' ? 'check' : 'x'} size={12}/>{r.status}
              </span>
            </div>
          );
        })}
        {tenant.runs.length === 0
          ? <p className="px-4 py-6 text-center text-[13px] text-muted">No runs yet — chat with an agent or fire a schedule.</p>
          : runs.length === 0 && <p className="px-4 py-6 text-center text-[13px] text-muted">No runs match this filter.</p>}
      </div>
    </ViewShell>
  );
}

function CreateWorkspaceModal({ onClose, onCreate, existingSubs }) {
  const [name, setName] = useState('');
  const [sub, setSub] = useState('');
  const [slugTouched, setSlugTouched] = useState(false);
  const [plan, setPlan] = useState('Free');
  const [tz, setTz] = useState('America/Los_Angeles');
  const [starter, setStarter] = useState(true);
  const derived = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 24);
  const slug = slugTouched ? sub : derived;
  const taken = existingSubs.includes(slug);
  const patternOk = /^[a-z0-9-]*$/.test(slug);
  const valid = name.trim().length > 1 && slug.length > 1 && patternOk && !taken;
  return (
    <Modal title="Create a workspace" onClose={onClose} odId="ws-create-modal"
      footer={<>
        <button type="button" onClick={onClose} className="flex h-9 items-center rounded-md px-3.5 text-[13px] font-medium text-muted transition-colors hover:bg-[color-mix(in_oklab,var(--fg)_7%,transparent)] hover:text-fg2">Cancel</button>
        <button type="button" disabled={!valid} data-od-id="btn-ws-create" onClick={() => onCreate(blankTenant({ name: name.trim(), sub: slug, plan, tz, starter }))}
          className="flex h-9 items-center rounded-md bg-accent px-3.5 text-[13px] font-semibold text-accenton transition-colors hover:bg-[var(--accent-hover)] active:bg-[var(--accent-active)] disabled:opacity-40 disabled:hover:bg-accent">
          Create workspace
        </button>
      </>}>
      <div className="space-y-5 p-5">
        <div>
          <label className={labelCls} htmlFor="cw-name">Workspace name</label>
          <input id="cw-name" className={inputCls} value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Initech" autoFocus/>
        </div>
        <div>
          <label className={labelCls} htmlFor="cw-sub">Workspace URL</label>
          <div className="flex items-center gap-2">
            <input id="cw-sub" className={cx(inputCls, 'font-mono text-[13px]')} value={slug}
              onChange={(e) => { setSub(e.target.value); setSlugTouched(true); }} placeholder="initech"/>
            <span className="shrink-0 font-mono text-[13px] text-muted">.onclaw.app</span>
          </div>
          {taken && <p className="mt-1.5 text-[11px] text-danger">That URL is taken — pick another.</p>}
          {!patternOk && <p className="mt-1.5 text-[11px] text-danger">Lowercase letters, digits and hyphens only.</p>}
        </div>
        <div className="grid grid-cols-2 gap-4">
          <div>
            <span className={labelCls}>Plan</span>
            <Segmented value={plan.toLowerCase()} onChange={(v) => setPlan(v === 'pro' ? 'Pro' : 'Free')}
              options={[{ id: 'free', label: 'Free' }, { id: 'pro', label: 'Pro' }]}/>
          </div>
          <div>
            <label className={labelCls} htmlFor="cw-tz">Timezone</label>
            <select id="cw-tz" className={inputCls} value={tz} onChange={(e) => setTz(e.target.value)}>
              {['America/Los_Angeles', 'America/New_York', 'Europe/London', 'Europe/Berlin', 'Asia/Singapore'].map((z) => <option key={z}>{z}</option>)}
            </select>
          </div>
        </div>
        <div className="flex items-center justify-between rounded-md border border-line bg-[color-mix(in_oklab,var(--fg)_3%,transparent)] px-4 py-3">
          <div>
            <p className="text-[13px] font-medium text-fg">Include a starter agent</p>
            <p className="text-[12px] text-muted">Adds “Guide” and a #general channel so the workspace is usable immediately.</p>
          </div>
          <Toggle on={starter} onChange={setStarter} label="Include a starter agent"/>
        </div>
      </div>
    </Modal>
  );
}

        <div className="od-scroll flex-1 overflow-y-auto p-6">
          {tab === 'workspace' && (

/* ============================== app root ============================== */
function craftReply(agent, text) {
  const c = text.trim().toLowerCase();
  if (c.startsWith('/tools')) return 'Tools granted to me: ' + (agent.tools.join(', ') || 'none yet') + '. Grant or revoke them in Settings → Agents → ' + agent.name + '.';
  if (c.startsWith('/model')) return 'I run on ' + agent.model + ' at temperature ' + agent.temp.toFixed(1) + '. Switch models in Settings → Agents.';
  if (c.startsWith('/help')) return 'Commands: /tools — list my tools · /model — current model · /schedule — open the cron editor · /reset — clear this thread. Everything else you type goes straight to me.';
  if (c.startsWith('/schedule')) return 'Schedules live in the Cron view — opening the editor for you now.';
  return REPLY_TEMPLATES[Math.floor(Math.random() * REPLY_TEMPLATES.length)];
}

function App() {
  const [pos, setPos] = useState(() => {
    const p = loadPos();
    return p && p.tenantId && p.view ? p : { tenantId: 'acme', view: 'chats', chatId: 'a-atlas', showContext: false };
  });
  const [db, setDb] = useState(seedDb);
  const [search, setSearch] = useState('');
  const [ui, setUi] = useState({ settingsOpen: false, settingsTab: 'workspace', configAgent: null, cronEdit: null, wsOpen: false, createWsOpen: false, toasts: [], typing: false, streamId: null });
  const patch = (p) => setUi((u) => ({ ...u, ...p }));
  const go = (p) => setPos((prev) => ({ ...prev, ...p }));

  useEffect(() => { savePos(pos); }, [pos]);
  useEffect(() => {
    const h = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        const el = document.getElementById('od-search');
        if (el) el.focus();
      }
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, []);

  const tenant = db[pos.tenantId] || db.acme;
  const goChat = (id, extra) => go({ view: 'chats', chatId: id, ...(extra || {}) });
  const chatId = tenant.agents.some((a) => a.id === pos.chatId) || tenant.channels.some((c) => c.id === pos.chatId) || tenant.people.some((p) => p.id === pos.chatId)
    ? pos.chatId : tenant.agents[0].id;
  const agent = tenant.agents.find((a) => a.id === chatId) || null;
  const channel = tenant.channels.find((c) => c.id === chatId) || null;
  const person = tenant.people.find((p) => p.id === chatId) || null;
  const chatAgent = agent || (channel ? tenant.agents.find((a) => a.id === channel.agentId) || null : null);
  const channelMembers = channel ? (() => {
    const ids = channel.members && channel.members.length ? channel.members : (channel.agentId ? [channel.agentId] : []);
    const out = [];
    ids.forEach((id) => {
      if (out.some((m) => m.id === id)) return;
      const a = tenant.agents.find((x) => x.id === id);
      if (a) { out.push({ id, kind: 'agent', name: a.name, agent: a }); return; }
      const p = tenant.people.find((x) => x.id === id);
      if (p) out.push({ id, kind: 'person', name: p.name, presence: p.presence });
    });
    return out;
  })() : null;
  const memberCandidates = channel ? (() => {
    const inCh = new Set([...(channel.members || []), channel.agentId].filter(Boolean));
    const out = [];
    tenant.agents.forEach((a) => { if (!inCh.has(a.id)) out.push({ id: a.id, kind: 'agent', name: a.name, agent: a }); });
    tenant.people.forEach((p) => { if (!inCh.has(p.id)) out.push({ id: p.id, kind: 'person', name: p.name, presence: p.presence }); });
    return out;
  })() : [];
  const target = agent ? { kind: 'agent', obj: agent }
    : channel ? { kind: 'channel', obj: channel }
    : { kind: 'person', obj: person || { name: 'Thread', presence: 'away' } };
  const threadState = getThreadState(tenant, chatId);
  const session = threadState.list.find((s) => s.id === threadState.active) || null;
  const thread = session ? session.messages : [];
  const hasTarget = !!(agent || channel || person);
  const unread = tenant.channels.reduce((n, c) => n + (c.unread || 0), 0);

  const toast = (text, kind) => {
    const id = uid('t');
    setUi((u) => ({ ...u, toasts: [...u.toasts, { id, text, kind }] }));
    setTimeout(() => setUi((u) => ({ ...u, toasts: u.toasts.filter((t) => t.id !== id) })), 3200);
  };
  const updateTenant = (fn) => setDb((prev) => ({ ...prev, [tenant.id]: fn(clone(prev[tenant.id])) }));
  const pushMsg = (tid, cid, msg) => setDb((prev) => {
    const d = clone(prev);
    const t = d[tid];
    const th = t.threads[cid] = t.threads[cid] || { active: null, list: [] };
    if (Array.isArray(th)) { t.threads[cid] = { active: null, list: th.length ? [{ id: uid('s'), title: 'Chat', updated: '', messages: th }] : [] }; }
    const state = t.threads[cid];
    let s = state.list.find((x) => x.id === state.active);
    if (!s) {
      s = { id: uid('s'), title: 'New chat', updated: nowTime(), messages: [] };
      state.list.unshift(s);
      state.active = s.id;
    }
    s.messages.push(msg);
    if (msg.author === 'you' && (s.title === 'New chat' || !s.title)) {
      s.title = msg.text.length > 42 ? msg.text.slice(0, 42) + '…' : msg.text;
    }
    s.updated = 'just now';
    return d;
  });

  const selectChat = (id) => {
    goChat(id);
    const ch = tenant.channels.find((c) => c.id === id);
    if (ch) go({ showContext: true }); // channels open with the members drawer
    else go({ showContext: false });
    if (ch && ch.unread) updateTenant((t) => ({ ...t, channels: t.channels.map((c) => (c.id === id ? { ...c, unread: 0 } : c)) }));
  };

  // open an agent or teammate from a channel member list
  const openMember = (id) => { if (id) goChat(id); };

  const addChannelMember = (id) => {
    if (!id) return;
    updateTenant((t) => ({ ...t, channels: t.channels.map((c) => (c.id === chatId && !(c.members || []).includes(id) ? { ...c, members: [...(c.members || (c.agentId ? [c.agentId] : [])), id] } : c)) }));
    const m = tenant.agents.find((x) => x.id === id) || tenant.people.find((x) => x.id === id);
    toast((m ? m.name : 'Member') + ' added to #' + channel.name);
  };
  const removeChannelMember = (id) => {
    if (!id || (channel && id === channel.agentId)) return;
    updateTenant((t) => ({ ...t, channels: t.channels.map((c) => (c.id === chatId ? { ...c, members: (c.members || []).filter((x) => x !== id) } : c)) }));
    const m = tenant.agents.find((x) => x.id === id) || tenant.people.find((x) => x.id === id);
    toast((m ? m.name : 'Member') + ' removed from #' + channel.name);
  };

  const respondFor = (ag, origText, cid, opts) => {
    const delay = opts && opts.delay;
    const mentioned = opts && opts.mentioned;
    patch({ typing: true });
    setTimeout(() => {
      const isSlash = origText.trim().startsWith('/');
      const mid = uid('m');
      pushMsg(tenant.id, cid, {
        id: mid, author: 'agent', agentId: ag.id, ts: nowTime(),
        text: mentioned ? MENTION_REPLIES[Math.floor(Math.random() * MENTION_REPLIES.length)] : craftReply(ag, origText),
        tools: isSlash || ag.tools.length === 0 ? undefined
          : [{ name: ag.tools[0] + '.query', args: 'q: ' + origText.slice(0, 48), ms: 600 + Math.floor(Math.random() * 900) }]
      });
      patch({ typing: false, streamId: mid });
      if (!mentioned && origText.trim().toLowerCase().startsWith('/schedule')) {
        setTimeout(() => patch({ cronEdit: { id: null, name: '', agentId: ag.id, expr: '0 9 * * 1-5', human: '', enabled: true } }), 700);
      }
    }, delay || 850 + Math.random() * 550);
  };

  const send = (text) => {
    const tid = tenant.id;
    pushMsg(tid, chatId, { id: uid('m'), author: 'you', ts: nowTime(), text });
    if (target.kind === 'person' || !chatAgent) return;
    if (text.trim().toLowerCase().startsWith('/reset')) {
      setDb((prev) => {
        const d = clone(prev);
        const th = d[tid].threads[chatId];
        const s = th && th.list.find((x) => x.id === th.active);
        if (s) { s.messages = []; s.title = 'New chat'; s.updated = nowTime(); }
        return d;
      });
      toast('Thread cleared');
      return;
    }
    if (target.kind === 'channel' && channelMembers) {
      // mentioned agents respond as themselves; unmentioned messages fall to the primary agent
      const mentionedAgents = parseMentions(text, channelMembers)
        .filter((m) => m.kind === 'agent')
        .map((m) => tenant.agents.find((a) => a.id === m.id))
        .filter(Boolean);
      if (mentionedAgents.length) {
        mentionedAgents.forEach((ag, i) => respondFor(ag, text, chatId, { delay: 850 + i * 1200 + Math.random() * 400, mentioned: true }));
        return;
      }
    }
    respondFor(chatAgent, text, chatId);
  };

  // assistant-ui ActionBar Reload — regenerate produces an alternate branch
  const refreshMessage = (mid) => {
    if (target.kind === 'person' || !chatAgent) return;
    const tid = tenant.id, cid = chatId;
    const thState = getThreadState(db[tid], cid);
    const s = thState.list.find((x) => x.id === thState.active);
    const m = s && s.messages.find((x) => x.id === mid);
    if (!m || m.author !== 'agent') return;
    const cur = ((m.branches && (m.branches[m.branch || 0] || {}).text) || m.text) || '';
    let next = cur;
    for (let k = 0; k < 6 && next === cur; k++) next = REPLY_TEMPLATES[Math.floor(Math.random() * REPLY_TEMPLATES.length)];
    patch({ typing: true });
    setTimeout(() => {
      setDb((prev) => {
        const d = clone(prev);
        const th = d[tid].threads[cid];
        const sess = th && th.list.find((x) => x.id === th.active);
        const mm = sess && sess.messages.find((x) => x.id === mid);
        if (!mm) return prev;
        mm.branches = [...variantsOf(mm), { text: next }];
        mm.branch = mm.branches.length - 1;
        return d;
      });
      patch({ typing: false, streamId: mid });
    }, 650 + Math.random() * 450);
  };

  const branchNav = (mid, dir) => {
    const tid = tenant.id, cid = chatId;
    setDb((prev) => {
      const d = clone(prev);
      const th = d[tid].threads[cid];
      const sess = th && th.list.find((x) => x.id === th.active);
      const mm = sess && sess.messages.find((x) => x.id === mid);
      if (!mm) return prev;
      const count = (mm.branches || []).length || 1;
      mm.branch = Math.min(count - 1, Math.max(0, (mm.branch || 0) + dir));
      return d;
    });
    patch({ streamId: null });
  };

  // assistant-ui edit-and-resubmit — editing truncates the fork and re-runs
  const editSubmit = (mid, newText) => {
    const tid = tenant.id, cid = chatId;
    setDb((prev) => {
      const d = clone(prev);
      const th = d[tid].threads[cid];
      const sess = th && th.list.find((x) => x.id === th.active);
      if (!sess) return prev;
      const i = sess.messages.findIndex((x) => x.id === mid);
      if (i < 0) return prev;
      sess.messages[i] = { ...sess.messages[i], text: newText };
      sess.messages = sess.messages.slice(0, i + 1);
      return d;
    });
    if (target.kind === 'person' || !chatAgent) return;
    respondFor(chatAgent, newText, cid);
  };

  // per-agent chat sessions (assistant-ui ThreadList semantics)
  const newSession = () => {
    if (target.kind !== 'agent') return;
    const tid = tenant.id, cid = chatId;
    setDb((prev) => {
      const d = clone(prev);
      const th = d[tid].threads[cid] = d[tid].threads[cid] || { active: null, list: [] };
      const cur = th.list.find((x) => x.id === th.active);
      if (cur && cur.messages.length === 0) return prev; // already on an empty session
      const s = { id: uid('s'), title: 'New chat', updated: nowTime(), messages: [] };
      th.list.unshift(s);
      th.active = s.id;
      return d;
    });
    patch({ typing: false, streamId: null });
  };

  const switchSession = (sid) => {
    const tid = tenant.id, cid = chatId;
    setDb((prev) => {
      const d = clone(prev);
      const th = d[tid].threads[cid];
      if (th && !Array.isArray(th)) th.active = sid;
      return d;
    });
    patch({ typing: false, streamId: null });
  };

  const deleteSession = (sid) => {
    const tid = tenant.id, cid = chatId;
    setDb((prev) => {
      const d = clone(prev);
      const th = d[tid].threads[cid];
      if (!th || Array.isArray(th)) return prev;
      th.list = th.list.filter((x) => x.id !== sid);
      if (th.list.length === 0) {
        const s = { id: uid('s'), title: 'New chat', updated: nowTime(), messages: [] };
        th.list.push(s);
        th.active = s.id;
      } else if (th.active === sid) {
        th.active = th.list[0].id;
      }
      return d;
    });
    patch({ typing: false, streamId: null });
    toast('Session deleted');
  };

  const switchTenant = (id) => {
    patch({ wsOpen: false });
    go({ tenantId: id, view: 'chats', chatId: db[id].agents[0].id });
    toast('Switched to ' + db[id].name);
  };

  // create ('new') or update an existing agent from the enriched config dialog
  const upsertAgent = (values) => {
    if (ui.configAgent === 'new') {
      const id = uid('a');
      updateTenant((t) => ({
        ...t,
        agents: [...t.agents, { id, ...values, status: 'idle', lastActive: 'just now' }],
        threads: { ...t.threads, [id]: { active: null, list: [] } }
      }));
      patch({ configAgent: null });
      goChat(id);
      toast(values.name + ' deployed — it idles until its first message');
    } else {
      const aid = ui.configAgent;
      updateTenant((t) => ({ ...t, agents: t.agents.map((a) => (a.id === aid ? { ...a, ...values } : a)) }));
      patch({ configAgent: null });
      toast(values.name + ' updated — new settings apply to the next run');
    }
  };

  const createTenant = (t) => {
    const norm = withSessions(t);
    setDb((prev) => ({ ...prev, [norm.id]: norm }));
    patch({ createWsOpen: false });
    go({ tenantId: t.id, view: 'chats', chatId: t.agents.length ? t.agents[0].id : '' });
    toast(t.name + ' created — you are its owner');
  };
  const deleteTenant = (id) => {
    const rest = Object.keys(db).filter((k) => k !== id);
    if (rest.length === 0) { toast('OnClaw keeps at least one workspace active', 'danger'); return; }
    const nextId = rest[0];
    const next = db[nextId];
    setDb((prev) => { const nd = { ...prev }; delete nd[id]; return nd; });
    patch({ settingsOpen: false });
    go({ tenantId: nextId, view: 'chats', chatId: next.agents.length ? next.agents[0].id : '' });
    toast('Workspace deleted — switched to ' + next.name);
  };

  const saveCron = (draft) => {
    if (draft.id) {
      updateTenant((t) => ({ ...t, cron: t.cron.map((j) => (j.id === draft.id ? { ...j, ...draft } : j)) }));
      toast('“' + draft.name + '” saved — fires ' + draft.human.toLowerCase());
    } else {
      updateTenant((t) => ({ ...t, cron: [...t.cron, { ...draft, id: uid('cron'), next: 'per expression', last: null }] }));
      toast('Schedule “' + draft.name + '” created');
    }
    patch({ cronEdit: null });
  };
  const toggleCron = (job) => {
    updateTenant((t) => ({ ...t, cron: t.cron.map((j) => (j.id === job.id ? { ...j, enabled: !j.enabled } : j)) }));
    toast((job.enabled ? 'Paused “' : 'Resumed “') + job.name + '”');
  };
  const deleteCron = (job) => {
    updateTenant((t) => ({ ...t, cron: t.cron.filter((j) => j.id !== job.id) }));
    patch({ cronEdit: null });
    toast('Schedule “' + job.name + '” deleted');
  };
  const runNow = (job) => {
    const rid = 'run_' + Math.floor(1000 + Math.random() * 8999);
    updateTenant((t) => ({ ...t, runs: [{ id: rid, agentId: job.agentId, trigger: 'manual', when: nowTime(), dur: '—', tokens: '—', status: 'running' }, ...t.runs] }));
    toast('Triggered “' + job.name + '”');
    setTimeout(() => {
      setDb((prev) => {
        const t = clone(prev[tenant.id]);
        t.runs = t.runs.map((r) => (r.id === rid ? { ...r, status: 'success', dur: '7s', tokens: '1.8k' } : r));
        return { ...prev, [tenant.id]: t };
      });
    }, 1600);
  };

  const configureAgent = (id) => {
    const aid = id || (chatAgent && chatAgent.id);
    if (aid) patch({ configAgent: aid });
  };
  const newSchedule = () => patch({ cronEdit: { id: null, name: '', agentId: tenant.agents[0].id, expr: '0 9 * * 1-5', human: '', enabled: true } });
  const copyText = (text) => {
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('Copied to clipboard'), () => toast('Clipboard blocked by the browser', 'danger'));
    else toast('Clipboard unavailable in this frame', 'danger');
  };

  return (
    <div className="flex h-screen overflow-hidden font-sans antialiased">
      <Rail view={pos.view} onNav={(v) => go({ view: v })} tenant={tenant} unread={unread}
        onOpenSwitcher={() => patch({ wsOpen: !ui.wsOpen })}
        onSettings={() => patch({ settingsOpen: true })}/>
      <WorkspaceSwitcher open={ui.wsOpen} db={db} currentId={tenant.id}
        onPick={switchTenant} onClose={() => patch({ wsOpen: false })}
        onCreate={() => patch({ wsOpen: false, createWsOpen: true })}/>
      {pos.view !== 'agents' && (
        <div className="hidden shrink-0 md:flex">
          <Sidebar view={pos.view} tenant={tenant} chatId={chatId} onSelect={selectChat}
            activeIsAgent={!!agent} session={session} sessions={threadState.list}
            onSwitchSession={switchSession} onNewSession={newSession} onDeleteSession={deleteSession}
            onDeploy={() => patch({ configAgent: 'new' })} onNewSchedule={newSchedule}
            onEditCron={(j) => patch({ cronEdit: j })}
            onOpenSwitcher={() => patch({ wsOpen: !ui.wsOpen })}
            search={search} setSearch={setSearch}/>
        </div>
      )}

      {pos.view === 'chats' && (hasTarget ? (
        <>
          <ChatView tenant={tenant} target={target} agent={chatAgent} thread={thread}
            session={session} channelMembers={channelMembers} onToggleMembers={() => go({ showContext: !pos.showContext })}
            typing={ui.typing} streamingId={ui.streamId} busy={ui.typing || !!ui.streamId}
            onSend={send} onCancel={() => patch({ typing: false, streamId: null })}
            onDoneStream={() => patch({ streamId: null })}
            onConfigure={() => configureAgent(chatAgent && chatAgent.id)}
            onCopy={copyText} onRefresh={refreshMessage} onBranch={branchNav} onEditSubmit={editSubmit}
            onAttach={() => toast('Attachments arrive with the storage integration — connect it in Settings → Integrations')}/>
          {pos.showContext && target.kind === 'channel' && (
            <div className="hidden xl:flex">
              <ContextPanel channelMembers={channelMembers} candidates={memberCandidates}
                primaryAgentId={channel ? channel.agentId : null}
                onAddMember={addChannelMember} onRemoveMember={removeChannelMember}
                onClose={() => go({ showContext: false })} onOpenMember={openMember}/>
            </div>
          )}
        </>
      ) : (
        <OnboardingPane tenant={tenant}
          onDeploy={() => patch({ configAgent: 'new' })}
          onSettings={() => patch({ settingsOpen: true, settingsTab: 'workspace' })}/>
      ))}
      {pos.view === 'agents' && (
        <AgentsView tenant={tenant}
          onChat={(id) => goChat(id)}
          onConfigure={configureAgent}
          onDeploy={() => patch({ configAgent: 'new' })}/>
      )}
      {pos.view === 'cron' && (
        <CronView tenant={tenant}
          onEdit={(j) => patch({ cronEdit: j })}
          onToggle={toggleCron} onRunNow={runNow} onNew={newSchedule}/>
      )}
      {pos.view === 'runs' && <RunsView tenant={tenant}/>}

      {ui.settingsOpen && (
        <SettingsModal tenant={tenant} tab={ui.settingsTab} onTab={(t) => patch({ settingsTab: t })}
          onClose={() => patch({ settingsOpen: false })}
          onUpdate={updateTenant} onToast={toast} onDeleteWorkspace={() => deleteTenant(tenant.id)}/>
      )}
      {ui.configAgent && (
        <AgentConfigModal key={ui.configAgent}
          draft={ui.configAgent === 'new' ? null : (tenant.agents.find((a) => a.id === ui.configAgent) || null)}
          skillOptions={SKILLS.concat((tenant.skillLib || []).filter((s) => !SKILLS.some((r) => r.id === s.id)).map((s) => ({ id: s.id, label: s.name })))}
          onClose={() => patch({ configAgent: null })} onSave={upsertAgent}/>
      )}
      {ui.cronEdit && (
        <CronEditorModal job={ui.cronEdit} tenant={tenant}
          onClose={() => patch({ cronEdit: null })} onSave={saveCron} onDelete={deleteCron}/>
      )}
      {ui.createWsOpen && (
        <CreateWorkspaceModal onClose={() => patch({ createWsOpen: false })} onCreate={createTenant}
          existingSubs={Object.values(db).map((t) => t.sub)}/>
      )}
      <Toasts toasts={ui.toasts}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

  <!-- Keyhole -->
  <circle cx="250" cy="172" r="7" fill="#2f6feb" />
  <path d="M247 175 L253 175 L255 192 L245 192 Z" fill="#2f6feb" />

  <!-- Floating Key / Access Card / Accent -->
  <g transform="translate(320, 160) rotate(15)">
    <rect x="0" y="0" width="48" height="32" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
    <circle cx="12" cy="16" r="5" fill="#2f6feb" opacity="0.3" />
    <line x1="22" y1="12" x2="38" y2="12" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" />
    <line x1="22" y1="20" x2="32" y2="20" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%" fill="none">
  <!-- Background Accents -->
  <circle cx="250" cy="175" r="140" fill="#f1f5f9" />
  <circle cx="130" cy="100" r="12" fill="#2f6feb" opacity="0.15" />
  <circle cx="370" cy="240" r="8" fill="#2f6feb" opacity="0.2" />
  <circle cx="120" cy="230" r="6" fill="#94a3b8" opacity="0.4" />

  <!-- Ground Plane Shadow -->
  <ellipse cx="250" cy="290" rx="160" ry="14" fill="#e2e8f0" />

  <!-- Shield Shape Background -->
  <path d="M250 80 L330 115 C330 190 250 240 250 240 C250 240 170 190 170 115 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <path d="M250 92 L318 122 C318 185 250 228 250 228 C250 228 182 185 182 122 Z" fill="#eff6ff" />

  <!-- Padlock in Foreground -->
  <!-- Shackle -->
  <path d="M226 150 L226 130 C226 116.7 236.7 106 250 106 C263.3 106 274 116.7 274 130 L274 150" stroke="#2f6feb" stroke-width="8" stroke-linecap="round" fill="none" />
  <!-- Lock Body -->

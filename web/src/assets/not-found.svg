  <rect x="185" y="118" width="80" height="8" rx="4" fill="#e2e8f0" />
  <rect x="185" y="134" width="130" height="6" rx="3" fill="#f1f5f9" />
  <rect x="185" y="146" width="110" height="6" rx="3" fill="#f1f5f9" />

  <!-- Big 404 Visual -->
  <rect x="195" y="170" width="110" height="70" rx="10" fill="#eff6ff" />
  <text x="250" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#2f6feb" text-anchor="middle" letter-spacing="2">404</text>

  <!-- Magnifying Glass Search Graphic -->
  <g transform="translate(280, 160)">
    <circle cx="45" cy="45" r="32" fill="#ffffff" stroke="#2f6feb" stroke-width="6" />
    <circle cx="45" cy="45" r="22" fill="#2f6feb" opacity="0.1" />
    <line x1="68" y1="68" x2="95" y2="95" stroke="#2f6feb" stroke-width="7" stroke-linecap="round" />
    <!-- Question Mark inside Lens -->
    <path d="M41 36 C41 31.5 44.5 28 49 28 C53.5 28 57 31.5 57 36 C57 39 55 41 52 43 C49.5 44.8 49 46.5 49 49" fill="none" stroke="#2f6feb" stroke-width="3" stroke-linecap="round" />
    <circle cx="49" cy="55" r="2" fill="#2f6feb" />
  </g>
</svg>

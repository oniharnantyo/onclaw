  <path d="M160 86 C160 77.16 167.16 70 176 70 L324 70 C332.84 70 340 77.16 340 86 L340 100 L160 100 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <circle cx="178" cy="85" r="4" fill="#cbd5e1" />
